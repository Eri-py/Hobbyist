<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification</title>
    <style>
      @media only screen and (max-width: 600px) {
        .card {
          width: 100% !important;
        }
        .header-td {
          padding: 28px 24px 24px !important;
        }
        .body-td {
          padding: 28px 24px 24px !important;
        }
        .footer-td {
          padding: 16px 24px !important;
        }
        .otp-code {
          font-size: 28px !important;
          letter-spacing: 6px !important;
        }
        .h1 {
          font-size: 22px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #eef0f7; font-family: Arial, sans-serif">
    <!-- Wrapper -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <!-- Card -->
          <table
            class="card"
            width="560"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border-radius: 16px;
              overflow: hidden;
            "
          >
            <!-- Header -->
            <tr>
              <td
                class="header-td"
                style="background-color: #2d4abf; padding: 40px 40px 32px; text-align: left"
              >
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    color: #dce5ff;
                    letter-spacing: 1px;
                    text-transform: uppercase;
                  "
                >
                  Hobbyist Team
                </p>
                <h1
                  class="h1"
                  style="
                    margin: 10px 0 0 0;
                    font-size: 26px;
                    font-weight: bold;
                    color: #ffffff;
                    line-height: 1.25;
                  "
                >
                  Verify your email address
                </h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td class="body-td" style="padding: 36px 40px 28px">
                <p style="margin: 0 0 24px 0; font-size: 15px; color: #6b7280; line-height: 1.6">
                  Use the one-time password below to verify your account and get started.
                </p>

                <!-- OTP Block -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      align="center"
                      style="
                        background-color: #f6f8ff;
                        border: 2px solid #dde4ff;
                        border-radius: 12px;
                        padding: 28px 24px;
                      "
                    >
                      <p
                        class="otp-code"
                        style="
                          margin: 0;
                          font-family: &quot;Courier New&quot;, Courier, monospace;
                          font-size: 36px;
                          font-weight: bold;
                          color: #2d4abf;
                          letter-spacing: 10px;
                        "
                      >
                        {{Otp}}
                      </p>
                      <p style="margin: 12px 0 0 0; font-size: 13px; color: #9ca3af">
                        Expires in <strong style="color: #4f6ee8">{{OtpValidFor}}</strong>
                      </p>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin: 28px 0 0 0;
                    padding-top: 28px;
                    border-top: 1px solid #f1f3f9;
                    font-size: 14px;
                    color: #6b7280;
                    line-height: 1.7;
                  "
                >
                  Thank you,<br /><strong style="color: #1a2340">Hobbyist Team</strong>
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                class="footer-td"
                style="
                  background-color: #f8f9fc;
                  border-top: 1px solid #edf0f7;
                  padding: 20px 40px;
                  text-align: center;
                "
              >
                <p style="margin: 0; font-size: 12px; color: #b0b7c3; line-height: 1.6">
                  If you didn't request this, you can safely ignore this email.<br />Someone else
                  may have typed your address by mistake.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
