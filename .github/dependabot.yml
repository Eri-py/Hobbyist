version: 2
updates:
  # pnpm monorepo - check root
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "daily"
    # Dependabot doesn't fully support pnpm workspaces yet
    # It will update root package.json and workspace packages

  # .NET backend
  - package-ecosystem: "nuget"
    directory: "/WebServer/"
    schedule:
      interval: "daily"
