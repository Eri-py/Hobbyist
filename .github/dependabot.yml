version: 2
updates:
  # pnpm monorepo - check root
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-worklets"
      - dependency-name: "zod"
    # Dependabot doesn't fully support pnpm workspaces yet
    # It will update root package.json and workspace packages

  # .NET backend
  - package-ecosystem: "nuget"
    directory: "/WebServer/"
    schedule:
      interval: "weekly"
      day: "monday"
