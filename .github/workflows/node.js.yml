name: Node.js CI
permissions:
    contents: read

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.34.2

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 25.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint --max-warnings=0

            - name: Test
              run: pnpm test

            - name: Build Website
              run: pnpm --dir Website build
              env:
                  CI: true

            - name: Build Mobile
              run: pnpm --dir Mobile build
              env:
                  CI: true
