name: Node.js CI
permissions:
    contents: read

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.23.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 25.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint --max-warnings=0

            - name: Build Website
              run: pnpm build:web
              env:
                  CI: true

            - name: Build Mobile
              run: pnpm build:mobile
              env:
                  CI: true
