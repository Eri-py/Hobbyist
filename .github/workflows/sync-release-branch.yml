name: Sync Release Branch
permissions:
    contents: write
    pull-requests: write

on:
    schedule:
        # Every Monday at 09:00 UTC
        - cron: "0 9 * * 1"
    workflow_dispatch:

concurrency:
    group: sync-release-branch
    cancel-in-progress: false

jobs:
    sync-release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0

            - name: Open PR from main into release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  if ! git ls-remote --exit-code --heads origin release > /dev/null; then
                    echo "Release branch does not exist. Skipping."
                    exit 0
                  fi

                  git fetch origin release

                  COMMITS_AHEAD=$(git rev-list --count origin/release..origin/main)
                  if [ "$COMMITS_AHEAD" -eq 0 ]; then
                    echo "Release is already up to date with main."
                    exit 0
                  fi

                  EXISTING=$(gh pr list --base release --head main --state open --json number --jq '.[0].number')
                  if [ -n "$EXISTING" ]; then
                    echo "PR #$EXISTING already exists. Skipping."
                    exit 0
                  fi

                  PR_URL=$(gh pr create \
                    --base release \
                    --head main \
                    --title "chore: sync main into release" \
                    --body "Automated weekly sync of main into release.")

                  gh pr merge --auto --merge "$PR_URL"
