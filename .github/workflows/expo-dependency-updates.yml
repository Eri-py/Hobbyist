name: Expo Weekly Dependency Fix
permissions:
    contents: read

on:
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

jobs:
    expo-deps-fix:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10.34.2

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 25.x
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Expo Install Fix
              run: pnpm --filter mobile exec expo install --fix
